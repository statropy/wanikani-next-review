[project]
name = "wanikani-next-review"
version = "1.0.0"
description = "Check when the next WaniKani review will be available for your current level"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "keyring>=25.6.0",
    "pyinstaller>=6.16.0",
    "requests>=2.31.0",
    "rumps>=0.4.0",
]

[project.scripts]
wanikani-cli = "cli:main"
wanikani-macos = "macos_widget:main"
